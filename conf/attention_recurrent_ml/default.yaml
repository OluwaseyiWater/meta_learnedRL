meta_lr: 2.5e-5
inner_lr: 1e-4
inner_steps: 5
num_tasks_per_batch: 16
num_meta_iterations: 500

# PPO specific
clip_ratio: 0.2
vf_coef: 0.5
ent_coef: 0.01
max_grad_norm: 0.5
gamma: 0.99
lambda_: 0.95

# Logging and Evaluation
use_wandb: False
wandb_project: "maml-spectrum-access"
wandb_name: "robust-recurrent-maml-ppo-v3-optimized"
log_interval: 10
eval_interval: 50
num_eval_tasks: 10

# Network architecture
num_lstm_layers: 2
lstm_hidden_dim: 128
mlp_hidden_dim: 128
num_attention_heads: 4