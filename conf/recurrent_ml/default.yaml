# Meta-Learning Hyperparameters
meta_lr: 3e-5
inner_lr: 1e-4
inner_steps: 5
num_tasks_per_batch: 16
num_meta_iterations: 500
clip_ratio: 0.2
wandb_project: "recurrent-maml-ppo"
wandb_name: null
use_wandb: true

# Evaluation & Logging
log_interval: 10
eval_interval: 50
num_eval_tasks: 10

# Network Hyperparameters
lstm_hidden_dim: 64
mlp_hidden_dim: 128
critic_hidden_dim: 128
